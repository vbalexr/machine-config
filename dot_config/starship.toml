"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$kubernetes\
$fill\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"
vimcmd_symbol = "[❮](bold #a6e3a1)"

[username]
style_user = "bold #89b4fa"
style_root = "bold #f38ba8"
format = "[$user]($style) "
show_always = false

[hostname]
ssh_only = true
format = "on [$hostname](bold #f9e2af) "

[directory]
style = "bold #a6e3a1"
truncation_length = 4
truncate_to_repo = true
format = "in [$path]($style)[$read_only]($read_only_style) "
read_only = " "
read_only_style = "#f38ba8"

[git_branch]
symbol = " "
style = "bold #cba6f7"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #f38ba8"
format = "([$all_status$ahead_behind]($style)) "

[kubernetes]
disabled = false
symbol = "☸ "
style = "bold #74c7ec"
format = "on [$symbol$context( \\($namespace\\))]($style) "
detect_extensions = []
detect_files = ["kustomization.yaml", "kustomization.yml", "Chart.yaml", ".flux.yaml"]
detect_folders = []

[cmd_duration]
min_time = 2000
style = "#f9e2af"
format = "took [$duration]($style) "

[fill]
symbol = " "
