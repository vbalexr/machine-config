conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    use_xft = true,
    font = 'Noto Sans:size=10',
    gap_x = 16,
    gap_y = 40,
    minimum_width = 210,
    maximum_width = 210,
    minimum_height = 500,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    stippled_borders = 0,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,
    default_color = 'cdd6f4',
    color1 = '89b4fa',
    color2 = 'a6e3a1',
    color3 = 'f38ba8',
};

conky.text = [[
${color1}${font Noto Sans:bold:size=12}SYSTEM${font}${color}
${hr 1}
Host   ${nodename}
Uptime ${uptime}
Kernel ${kernel}

${color1}${font Noto Sans:bold:size=11}CPU${font}${color}
${hr 1}
CPU ${alignr}${cpu cpu0}%
${alignr}${cpugraph cpu0 24,180 89b4fa 89b4fa}

${color2}${font Noto Sans:bold:size=11}MEMORY${font}${color}
${hr 1}
RAM ${alignr}${mem}/${memmax}
${alignr}${membar 10,180}

${color3}${font Noto Sans:bold:size=11}DISK${font}${color}
${hr 1}
Root ${alignr}${fs_used /}/${fs_size /}
${alignr}${fs_bar 10,180 /}

${color1}${font Noto Sans:bold:size=11}NETWORK${font}${color}
${hr 1}
${if_up wlan0}${addr wlan0}
Down ${alignr}${downspeed wlan0}
${alignr}${downspeedgraph wlan0 20,180 89b4fa 89b4fa}
Up ${alignr}${upspeed wlan0}
${alignr}${upspeedgraph wlan0 20,180 a6e3a1 a6e3a1}
${else}No network interface detected
${endif}
]];
